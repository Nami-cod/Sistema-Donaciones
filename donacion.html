<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="estilos.css">
    <title>Donaciones</title>
</head>
<body>
    <header id="navbar">
      <div class="logo">PUCE</div>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="registro.html">Donar</a></li>
          <li><a href="estadistica.html">Estadísticas</a></li>
        </ul>
      </nav>
    </header>
    <h1 id="form-group">Sistema de Donaciones</h1>

    <form id="formdonacion">
        <div class="form-grid">

            <div class="form-group">
                <label for="area">Selecciona el área a donar:</label><br>
                <select id="area" name="area" required>
                    <option value="">-- Selecciona una opción --</option>
                    <option value="Audiovisual">1. Proyecto Audiovisual</option>
                    <option value="Becas">2. Proyecto Becas</option>
                    <option value="Artes">3. Proyecto Artes</option>
                </select><br><br>
            </div>

            <!-- Aquí se muestra la listita según el área elegida -->
            <div class="form-group">
                <p id="detalleArea"></p>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre del donante:</label><br>
                <input type="text" id="nombre" name="nombre" required><br><br>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico:</label><br>
                <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com"><br><br>
            </div>

            <div class="form-group">
                <label for="monto">Monto a donar ($):</label><br>
                <input type="number" id="monto" name="monto" min="1" step="0.01" required><br><br>
            </div>

            <div class="form-group">
                <label for="metodoPago">Método de pago:</label><br>
                <select id="metodoPago" name="metodoPago" required>
                    <option value="">-- Selecciona una opción --</option>
                    <option value="Visa">1. Visa</option>
                    <option value="Mastercard">2. Mastercard</option>
                    <option value="Transferencia">3. Transferencia</option>
                </select><br><br>
            </div>

            <p id="mensaje-validacion"></p>
            <button type="submit">Donar</button>

        </div>
    </form>

    <!-- Aquí aparece el comprobante después de donar -->
    <div id="comprobante"></div>

    <script src="donacion.js"></script>
</body>
</html>
