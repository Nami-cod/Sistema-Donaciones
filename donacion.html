<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="estilos.css">
    <title>Donaciones</title>

    <style>
        .form-group {
            display: flex;
            flex-direction: column;
        }

        .botones-area, .botones-metodo {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 10px 0;
        }

        .btn-area, .btn-metodo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 160px;
            height: 130px;
            border: 2px solid #ccc;
            border-radius: 14px;
            background: #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            text-align: center;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-area { font-size: 3rem; }
        .btn-area span, .btn-metodo span { font-size: 1rem; font-weight: 500; }
        .icono-metodo { font-size: 2.8rem; }

        .btn-area:hover, .btn-metodo:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
        }

        .btn-area.seleccionado, .btn-metodo.seleccionado {
            border-color: #2e7d32;
            background: #eaf7ea;
            font-weight: 600;
        }

        #datosDonante { font-weight: 500; }

        /* Aviso cuando la cédula no está registrada */
        #avisoRegistro {
            border: 2px dashed #c62828;
            border-radius: 10px;
            padding: 14px;
            margin-top: 10px;
            color: #c62828;
        }

        #avisoRegistro a {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 16px;
            background: #c62828;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .excel-section {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .excel-section button, .btn-cargar {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background: #1565c0;
            color: white;
            cursor: pointer;
            font-family: inherit;
        }

        .excel-section button:hover, .btn-cargar:hover { background: #0d47a1; }
    </style>
</head>
<body>
    <header id="navbar">
      <div class="logo">PUCE</div>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="registro.html">Donar</a></li>
          <li><a href="estadistica.html">Estadísticas</a></li>
        </ul>
      </nav>
    </header>
    <h1 id="form-group">Sistema de Donaciones</h1>

    <form id="formdonacion">
        <div class="form-grid">

            <!-- Paso 1: verificar cédula -->
            <div class="form-group">
                <label for="cedulaBusqueda">Cédula del donante:</label><br>
                <input type="text" id="cedulaBusqueda" placeholder="1712345678" maxlength="10" required><br>
                <p id="datosDonante"></p>
                <input type="hidden" id="nombre">
                <input type="hidden" id="correo">
            </div>

            <!-- Aviso si la cédula no está registrada -->
            <div id="avisoRegistro" style="display:none;">
                <p>⚠️ Esta cédula no está registrada. Debes registrarte primero para poder donar.</p>
                <a href="registro.html">Ir a registrarme</a>
            </div>

            <!-- Paso 2: el resto del formulario, oculto hasta verificar la cédula -->
            <div id="panelDonacion" style="display:none;">

                <div class="form-group">
                    <label>Selecciona el área a donar:</label><br>
                    <div class="botones-area" id="botonesArea">
                        <button type="button" class="btn-area" data-area="Audiovisual">🎬<span>Audiovisual</span></button>
                        <button type="button" class="btn-area" data-area="Investigacion">🔬<span>Investigación</span></button>
                        <button type="button" class="btn-area" data-area="Artes">🎨<span>Artes</span></button>
                    </div>
                    <p id="detalleArea"></p>
                </div>

                <div class="form-group">
                    <label for="monto">Monto a donar (entre $5 y $250):</label><br>
                    <input type="number" id="monto" name="monto" min="5" max="250" step="0.01">
                </div>

                <div class="form-group">
                    <label>Método de pago:</label><br>
                    <div class="botones-metodo" id="botonesMetodo">
                        <button type="button" class="btn-metodo" data-metodo="Visa">
                            <span class="icono-metodo">💳</span><span>Visa</span>
                        </button>
                        <button type="button" class="btn-metodo" data-metodo="Mastercard">
                            <span class="icono-metodo">💳</span><span>Mastercard</span>
                        </button>
                        <button type="button" class="btn-metodo" data-metodo="Transferencia">
                            <span class="icono-metodo">🏦</span><span>Transferencia</span>
                        </button>
                    </div>
                </div>

                <p id="mensaje-validacion"></p>
                <button type="submit">Donar</button>
            </div>

        </div>
    </form>

    <div id="comprobante"></div>

    <div class="excel-section">
        <button type="button" id="btnExportarExcel">📥 Descargar historial en Excel</button>
        <label for="inputExcel" class="btn-cargar">📤 Cargar Excel</label>
        <input type="file" id="inputExcel" accept=".xlsx, .xls" style="display:none">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="donacion.js"></script>
</body>
</html>
