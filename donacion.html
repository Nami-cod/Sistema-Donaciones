<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Preconexión con fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="estilos.css">
    <title>Donaciones</title>

    <!-- Estilos solo para los elementos nuevos de esta página -->
    <style>
        .botones-area, .botones-metodo {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 10px 0;
        }

        .btn-area, .btn-metodo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 18px;
            border: 2px solid #ccc;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-area:hover, .btn-metodo:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }

        .btn-area.seleccionado, .btn-metodo.seleccionado {
            border-color: #2e7d32;
            background: #eaf7ea;
            font-weight: 600;
        }

        .icono-metodo {
            font-size: 1.8rem;
        }

        .barra-progreso {
            width: 100%;
            max-width: 400px;
            height: 22px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .barra-relleno {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4caf50, #2e7d32);
            color: white;
            font-size: 0.8rem;
            text-align: center;
            line-height: 22px;
            transition: width 0.4s ease;
            white-space: nowrap;
        }

        #datosDonante {
            font-weight: 500;
        }

        .excel-section {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .excel-section button, .btn-cargar {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background: #1565c0;
            color: white;
            cursor: pointer;
            font-family: inherit;
        }

        .excel-section button:hover, .btn-cargar:hover {
            background: #0d47a1;
        }
    </style>
</head>
<body>
    <header id="navbar">
      <div class="logo">PUCE</div>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="registro.html">Donar</a></li>
          <li><a href="estadistica.html">Estadísticas</a></li>
        </ul>
      </nav>
    </header>
    <h1 id="form-group">Sistema de Donaciones</h1>

    <form id="formdonacion">
        <div class="form-grid">

            <!-- Buscamos al donante por cédula para no pedirle sus datos otra vez -->
            <div class="form-group">
                <label for="cedulaBusqueda">Cédula del donante:</label><br>
                <input type="text" id="cedulaBusqueda" placeholder="1712345678" maxlength="10" required><br>
                <p id="datosDonante"></p>
                <!-- Guardamos aquí el nombre y correo encontrados, aunque no se vean -->
                <input type="hidden" id="nombre">
                <input type="hidden" id="correo">
            </div>

            <!-- Área de donación, ahora como botones -->
            <div class="form-group">
                <label>Selecciona el área a donar:</label><br>
                <div class="botones-area" id="botonesArea">
                    <button type="button" class="btn-area" data-area="Audiovisual">🎬<br>Audiovisual</button>
                    <button type="button" class="btn-area" data-area="Investigacion">🔬<br>Investigación</button>
                    <button type="button" class="btn-area" data-area="Artes">🎨<br>Artes</button>
                </div>
                <p id="detalleArea"></p>
                <div class="barra-progreso">
                    <div id="progresoRelleno" class="barra-relleno">0%</div>
                </div>
            </div>

            <div class="form-group">
                <label for="monto">Monto a donar (entre $5 y $250):</label><br>
                <input type="number" id="monto" name="monto" min="5" max="250" step="0.01" required>
            </div>

            <!-- Método de pago, ahora como botones con ícono -->
            <div class="form-group">
                <label>Método de pago:</label><br>
                <div class="botones-metodo" id="botonesMetodo">
                    <button type="button" class="btn-metodo" data-metodo="Visa">
                        <span class="icono-metodo">💳</span>Visa
                    </button>
                    <button type="button" class="btn-metodo" data-metodo="Mastercard">
                        <span class="icono-metodo">💳</span>Mastercard
                    </button>
                    <button type="button" class="btn-metodo" data-metodo="Transferencia">
                        <span class="icono-metodo">🏦</span>Transferencia
                    </button>
                </div>
            </div>

            <p id="mensaje-validacion"></p>
            <button type="submit">Donar</button>

        </div>
    </form>

    <!-- Aquí aparece el comprobante después de donar -->
    <div id="comprobante"></div>

    <!-- Botones para exportar/cargar el historial en Excel -->
    <div class="excel-section">
        <button type="button" id="btnExportarExcel">📥 Descargar historial en Excel</button>
        <label for="inputExcel" class="btn-cargar">📤 Cargar Excel</label>
        <input type="file" id="inputExcel" accept=".xlsx, .xls" style="display:none">
    </div>

    <!-- Librería para leer/escribir archivos Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="donacion.js"></script>
</body>
</html>
