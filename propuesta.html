<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenta tu Proyecto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="estilos.css">

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
 <header id="navbar">
  <div class="logo">PUCE</div>
  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="registro.html">Donar</a></li>
      <li><a href="propuesta.html">Postular</a></li>
      <li><a href="estadistica.html">Estadísticas</a></li>
    </ul>
  </nav>
 </header>

  <h1>Presenta tu Proyecto</h1><br>
  <form id="formPostulacion" class="form-grid">
    
    <div class="form-group">
      <label for="postulanteNombre">Nombre o Colectivo:</label>
      <input type="text" id="postulanteNombre" required>
    </div>

    <div class="form-group">
      <label for="postulanteEmail">Correo Electrónico:</label>
      <input type="email" id="postulanteEmail" placeholder="correo@correo.com" required>
    </div>

    <div class="form-group">
      <label for="postulanteTelefono">Teléfono Contacto:</label>
      <input type="tel" id="postulanteTelefono" placeholder="0991234567" required>
    </div>

    <div class="form-group">
      <label for="postulantePortafolio">Portafolio / Web:</label>
      <input type="url" id="postulantePortafolio" placeholder="link (opcional)">
    </div>

    <div class="form-group">
      <label for="proyectoTitulo">Título Proyecto:</label>
      <input type="text" id="proyectoTitulo" placeholder="Cortometraje Documental Raíces" required>
    </div>

    <div class="form-group">
      <label for="proyectoCategoria">Categoría:</label>
      <select id="proyectoCategoria" required>
        <option value="" disabled selected>Selecciona una área</option>
        <option value="Audiovisual">Audiovisual</option>
        <option value="Artes">Artes</option>
        <option value="Investigacion">Investigación</option>
      </select>
    </div>

    <div class="form-group">
      <label for="proyectoResumen">Explicación Breve:</label>
      <input type="text" id="proyectoResumen" maxlength="300" placeholder="Breve propósito del proyecto (máx. 300 caracteres)" required>
    </div>

    <div class="form-group">
      <label for="proyectoMonto">Monto Solicitado:</label>
      <input type="number" id="proyectoMonto" min="1" step="0.01" placeholder="Ej. 1000.00" required>
    </div>

    <div class="form-group">
      <label for="proyectoDuracion">Tiempo Ejecución:</label>
      <input type="text" id="proyectoDuracion" placeholder="Ej. 6 meses" required>
    </div>

    <div class="form-group">
      <label for="proyectoDesglose">Desglose Breve:</label>
      <input type="text" id="proyectoDesglose" placeholder="Ej. 40% Equipos, 30% Difusión" required>
    </div>

    <div class="form-group">
      <label for="proyectoDossier">Enlace Dossier / PDF:</label>
      <input type="url" id="proyectoDossier" placeholder="https://drive.google.com/ (opcional)">
    </div>

    <div class="form-actions">
      <button type="submit" id="btnGuardar">Guardar Postulación</button>
      <button type="button" id="btnDescargar" class="btn-secundario" disabled>Descargar Excel</button>
    </div>
  </form>

  <div id="mensaje-validacion"></div>
<script src="propuesta.js"></script>
</body>
</html>
