<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Preconexión con fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="estilos.css">
    <title>Registro de Donantes</title>
</head>
<body>
   <header id="navbar">
      <div class="logo">PUCE</div>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="registro.html">Donar</a></li>
          <li><a href="propuesta.html">Postular</a></li>
          <li><a href="estadistica.html">Estadísticas</a></li>
        </ul>
      </nav>
    </header>

     <h1 id="form-group">Registro de Donantes</h1><br>
   
        <form id="formregistro">
           
            <div class="form-grid">
                 <div class="form-group">
                 <label for="nombre">Nombres:</label><br>
                 <input type="text" id="nombre" name="nombres" required><br><br>
                </div>

                <div class="form-group">
                  <label for="apellido">Apellidos:</label><br>
                  <input type="text" id="apellido" name="apellidos" required><br><br>
                </div>

                <div class="form-group">
                  <label for="ci">Cédula:</label><br>
                  <input type="text" id="ci" name="ci" required placeholder="1712345678"><br><br>
                </div>

               <div class="form-group">
                 <label for="email">Correo Electrónico:</label><br>
                 <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com"><br><br>
               </div>

               <div class="form-group">
                 <label for="telefono">Número de Teléfono:</label><br>
                 <input type="tel" id="telefono" name="telefono" placeholder="0987654321"><br><br>
                </div>

                <p id="mensaje-validacion"></p>

               <button type="submit">Registrar</button>
            </div>
           
        </form>
 <script src="registro.js"></script>
</body>
</html>
