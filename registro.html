<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Donantes</title>
</head>
<body>
    <h1>Registro de Donantes</h1>
   <div id="seccion-registro" class="sheet active">
      <form id="registro">
         <label for="nombre">Nombres:</label>
         <input type="text" id="nombre" name="nombres" required><br><br>

         <label for="apellido">Apellidos:</label>
         <input type="text" id="apellido" name="apellidos" required><br><br>

         <label for="cedula">Cédula:</label>
         <input type="text" id="cedula" name="cedula" required placeholder="1712345678"><br><br>

         <label for="email">Correo Electrónico:</label>
         <input type="email" id="email" name="email" required placeholder="ejemplo@ejemplo.com"><br><br>

         <label for="telefono">Número de Teléfono:</label>
         <input type="tel" id="telefono" name="telefono" placeholder="0987654321"><br><br>


         <button type="submit">Registrar</button>
       </form>
    </div>

</body>
</html>
